# Compact portable summary using only normal Alexela sensor entities.
# Check Settings -> Devices & services -> Alexela if HA added a suffix or an
# entity was renamed locally.
type: grid
columns: 2
square: false
cards:
  - type: tile
    entity: sensor.alexela_electricity_consumption_this_month
    name: Usage · this month
    icon: mdi:meter-electric
  - type: tile
    entity: sensor.alexela_electricity_cost_this_month
    name: Cost · this month
    icon: mdi:cash
  - type: tile
    entity: sensor.alexela_electricity_estimated_bill_this_month
    name: Estimated bill · this month
    icon: mdi:receipt-text-clock-outline
  - type: tile
    entity: sensor.alexela_electricity_price_this_month
    name: Effective price · this month
    icon: mdi:shield-check
  - type: tile
    entity: sensor.alexela_latest_nord_pool_price_incl_vat
    name: Latest Nord Pool spot
    icon: mdi:transmission-tower

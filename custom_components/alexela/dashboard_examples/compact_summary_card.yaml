# A compact card using the normal sensor entities. Home Assistant usually
# assigns these entity IDs. Check Settings -> Devices & services -> Alexela and
# adjust them if your installation added a suffix or you renamed an entity.
type: entities
title: Alexela vs Nord Pool
show_header_toggle: false
entities:
  - entity: sensor.alexela_latest_nord_pool_price_incl_vat
    name: Latest matched spot price
    icon: mdi:lightning-bolt
  - entity: sensor.alexela_nord_pool_reference_cost_incl_vat
    name: Nord Pool + provider markup
    icon: mdi:chart-line
  - entity: sensor.alexela_electricity_cost_difference_vs_nord_pool
    name: Lost (+) / saved (-)
    icon: mdi:scale-balance

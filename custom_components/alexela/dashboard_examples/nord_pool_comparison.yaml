# Complete responsive Home Assistant dashboard.
#
# 1. Replace every REPLACE_WITH_CRM_ID with the CRM ID configured in Alexela.
# 2. Install "ApexCharts Card" from HACS.
# 3. Paste this complete file into a dashboard's raw configuration editor.
views:
  - title: Overview
    path: overview
    type: sections
    icon: mdi:lightning-bolt
    max_columns: 3
    badges:
      - type: entity
        entity: sensor.alexela_electricity_cost_this_month
        name: Month
        show_name: true
        show_state: true
        color: orange
      - type: entity
        entity: sensor.alexela_electricity_consumption_this_month
        name: Usage
        show_name: true
        show_state: true
        color: amber
      - type: entity
        entity: sensor.alexela_latest_nord_pool_price_incl_vat
        name: Latest spot
        show_name: true
        show_state: true
        color: blue
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Cost
            heading_style: title
            icon: mdi:cash-multiple
          - type: tile
            grid_options:
              rows: auto
            entity: sensor.alexela_electricity_cost_this_month
            name: This month
            icon: mdi:calendar-month
            state_content:
              - state
              - average_period_label
            vertical: true
            features_position: bottom
          - type: tile
            grid_options:
              columns: 6
              rows: auto
            entity: sensor.alexela_electricity_cost_last_7_available_days
            name: Last 7 days
            icon: mdi:calendar-week
            state_content:
              - state
              - average_period_label
            vertical: true
            features_position: bottom
          - type: tile
            grid_options:
              columns: full
              rows: auto
            entity: sensor.alexela_electricity_consumption_this_month
            name: This month
            icon: mdi:meter-electric
            state_content:
              - state
              - average_period_label
            vertical: false
            features_position: bottom

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Consumption history
            heading_style: title
            icon: mdi:chart-bar
            badges:
              - type: button
                icon: mdi:information-outline
                tap_action:
                  action: more-info
                  entity: sensor.alexela_electricity_15_minute_history
          - type: custom:apexcharts-card
            graph_span: 48h
            span:
              end: day
              offset: -1d
            header:
              show: true
              title: 15-minute consumption · latest available 48 hours
              show_states: false
            apex_config:
              chart:
                height: 380
              tooltip:
                shared: true
              yaxis:
                min: 0
                decimalsInFloat: 0
                title:
                  text: Wh
            series:
              - entity: sensor.alexela_electricity_15_minute_history
                name: 15-minute usage
                type: column
                color: "#f1c40f"
                unit: Wh
                float_precision: 0
                show:
                  legend_value: false
                data_generator: |
                  return (entity.attributes.interval_readings || [])
                    .map((point) => [new Date(point.start).getTime(), point.kwh * 1000]);
              - entity: sensor.alexela_electricity_15_minute_history
                name: Typical · weekday and time band
                type: line
                color: "#3498db"
                curve: smooth
                stroke_width: 3
                unit: Wh
                float_precision: 0
                show:
                  legend_value: false
                extend_to: false
                data_generator: |
                  return (entity.attributes.hourly_profile || [])
                    .map((point) => [new Date(point.start).getTime(), point.kwh * 1000]);
            grid_options:
              columns: full
              rows: 7
          - type: custom:apexcharts-card
            title: Daily consumption · last 30 days
            graph_span: 30d
            span:
              end: day
              offset: -1d
            header:
              show: true
              title: Daily consumption · rolling 30 days
              show_states: false
            apex_config:
              chart:
                height: 380
              tooltip:
                shared: true
              yaxis:
                min: 0
                decimalsInFloat: 2
                title:
                  text: kWh / day
            series:
              - entity: sensor.alexela_electricity_15_minute_history
                name: Daily usage
                type: column
                color: "#64a8d1"
                float_precision: 2
                show:
                  legend_value: false
                data_generator: |
                  return (entity.attributes.daily_readings || [])
                    .map((point) => [new Date(point.start).getTime(), point.kwh]);
              - entity: sensor.alexela_electricity_15_minute_history
                name: Average daily usage · calendar month
                type: line
                color: "#3498db"
                curve: smooth
                stroke_width: 3
                float_precision: 2
                extend_to: false
                show:
                  legend_value: false
                data_generator: |
                  return (entity.attributes.monthly_daily_profile || [])
                    .map((point) => [new Date(point.start).getTime(), point.kwh]);
            grid_options:
              columns: full
              rows: 7

      - type: grid
        cards:
          - type: heading
            heading: Fixed vs Nord Pool · this month
            heading_style: title
            icon: mdi:scale-balance
          - type: statistic
            entity: alexela:REPLACE_WITH_CRM_ID_electricity_cost
            name: Fixed-price total
            icon: mdi:shield-check
            unit: EUR
            stat_type: change
            period:
              calendar:
                period: month
            grid_options:
              columns: 12
              rows: 2
          - type: statistic
            entity: alexela:REPLACE_WITH_CRM_ID_nord_pool_provider_reference_cost
            name: Nord Pool + markup total
            icon: mdi:chart-line
            unit: EUR
            stat_type: change
            period:
              calendar:
                period: month
            grid_options:
              columns: 12
              rows: 2
          - type: statistic
            entity: alexela:REPLACE_WITH_CRM_ID_electricity_cost_difference_vs_nord_pool_provider
            name: Difference · negative means saved
            icon: mdi:scale-balance
            unit: EUR
            stat_type: change
            period:
              calendar:
                period: month
            grid_options:
              columns: 12
              rows: 2

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Price per kWh
            heading_style: title
            icon: mdi:currency-eur
          - type: tile
            entity: sensor.alexela_electricity_price_this_month
            name: Fixed effective price · this month
            icon: mdi:shield-check
            vertical: false
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.alexela_latest_nord_pool_price_incl_vat
            name: Latest matched Nord Pool spot price
            icon: mdi:transmission-tower
            vertical: false
            grid_options:
              columns: 12

  - title: Analytics
    path: analytics
    type: sections
    icon: mdi:chart-box-outline
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Historical consumption
            heading_style: title
            icon: mdi:history
          - type: statistic
            entity: alexela:REPLACE_WITH_CRM_ID_electricity_energy
            name: This month
            icon: mdi:calendar-month
            unit: kWh
            stat_type: change
            period:
              calendar:
                period: month
            grid_options:
              columns: 6
              rows: 2
          - type: statistic
            entity: alexela:REPLACE_WITH_CRM_ID_electricity_energy
            name: Previous month
            icon: mdi:calendar-arrow-left
            unit: kWh
            stat_type: change
            period:
              calendar:
                period: month
                offset: -1
            grid_options:
              columns: 6
              rows: 2
          - type: statistic
            entity: alexela:REPLACE_WITH_CRM_ID_electricity_energy
            name: This year
            icon: mdi:calendar
            unit: kWh
            stat_type: change
            period:
              calendar:
                period: year
            grid_options:
              columns: 6
              rows: 2
          - type: statistic
            entity: alexela:REPLACE_WITH_CRM_ID_electricity_energy
            name: Previous year
            icon: mdi:calendar-arrow-left
            unit: kWh
            stat_type: change
            period:
              calendar:
                period: year
                offset: -1
            grid_options:
              columns: 6
              rows: 2
          - type: statistic
            entity: alexela:REPLACE_WITH_CRM_ID_electricity_recorded_month_total
            name: Monthly average
            icon: mdi:chart-bell-curve
            unit: kWh
            stat_type: mean
            period:
              fixed_period: {}
            grid_options:
              columns: 4
              rows: 2
          - type: statistic
            entity: alexela:REPLACE_WITH_CRM_ID_electricity_recorded_month_total
            name: Minimum month
            icon: mdi:arrow-collapse-down
            unit: kWh
            stat_type: min
            period:
              fixed_period: {}
            grid_options:
              columns: 4
              rows: 2
          - type: statistic
            entity: alexela:REPLACE_WITH_CRM_ID_electricity_recorded_month_total
            name: Maximum month
            icon: mdi:arrow-expand-up
            unit: kWh
            stat_type: max
            period:
              fixed_period: {}
            grid_options:
              columns: 4
              rows: 2
          - type: statistics-graph
            title: Monthly consumption · 24 months
            entities:
              - entity: alexela:REPLACE_WITH_CRM_ID_electricity_energy
                name: kWh
                color: "#f1c40f"
            days_to_show: 730
            chart_type: bar
            stat_types:
              - change
            period: month
            min_y_axis: 0
            fit_y_data: true
            grid_options:
              columns: full
              rows: 7
          - type: statistics-graph
            title: Annual consumption · 5 years
            entities:
              - entity: alexela:REPLACE_WITH_CRM_ID_electricity_energy
                name: kWh
                color: "#f39c12"
            days_to_show: 1825
            chart_type: bar
            stat_types:
              - change
            period: year
            min_y_axis: 0
            fit_y_data: true
            grid_options:
              columns: full
              rows: 6
          - type: statistics-graph
            title: Daily consumption · 90 days
            entities:
              - entity: alexela:REPLACE_WITH_CRM_ID_electricity_energy
                name: kWh
                color: "#f1c40f"
            days_to_show: 90
            chart_type: bar
            stat_types:
              - change
            period: day
            min_y_axis: 0
            fit_y_data: true
            grid_options:
              columns: full
              rows: 7
          - type: statistics-graph
            title: Cumulative consumption
            entities:
              - entity: alexela:REPLACE_WITH_CRM_ID_electricity_energy
                name: kWh
                color: "#f39c12"
            days_to_show: 90
            chart_type: line
            stat_types:
              - sum
            period: day
            min_y_axis: 0
            fit_y_data: true
            grid_options:
              columns: full
              rows: 6

      - type: grid
        cards:
          - type: heading
            heading: Historical cost
            heading_style: title
            icon: mdi:cash-clock
          - type: statistic
            entity: alexela:REPLACE_WITH_CRM_ID_electricity_cost
            name: This month
            icon: mdi:calendar-month
            unit: EUR
            stat_type: change
            period:
              calendar:
                period: month
            grid_options:
              columns: 6
              rows: 2
          - type: statistic
            entity: alexela:REPLACE_WITH_CRM_ID_electricity_cost
            name: Previous month
            icon: mdi:calendar-arrow-left
            unit: EUR
            stat_type: change
            period:
              calendar:
                period: month
                offset: -1
            grid_options:
              columns: 6
              rows: 2
          - type: statistic
            entity: alexela:REPLACE_WITH_CRM_ID_electricity_cost
            name: This year
            icon: mdi:calendar
            unit: EUR
            stat_type: change
            period:
              calendar:
                period: year
            grid_options:
              columns: 6
              rows: 2
          - type: statistic
            entity: alexela:REPLACE_WITH_CRM_ID_electricity_cost
            name: Previous year
            icon: mdi:calendar-arrow-left
            unit: EUR
            stat_type: change
            period:
              calendar:
                period: year
                offset: -1
            grid_options:
              columns: 6
              rows: 2
          - type: statistics-graph
            title: Monthly fixed cost · 24 months
            entities:
              - entity: alexela:REPLACE_WITH_CRM_ID_electricity_cost
                name: Fixed cost
                color: "#e67e22"
            days_to_show: 730
            chart_type: bar
            stat_types:
              - change
            period: month
            min_y_axis: 0
            fit_y_data: true
            grid_options:
              columns: full
              rows: 7
          - type: statistics-graph
            title: Annual fixed cost · 5 years
            entities:
              - entity: alexela:REPLACE_WITH_CRM_ID_electricity_cost
                name: Fixed cost
                color: "#d35400"
            days_to_show: 1825
            chart_type: bar
            stat_types:
              - change
            period: year
            min_y_axis: 0
            fit_y_data: true
            grid_options:
              columns: full
              rows: 6

      - type: grid
        cards:
          - type: heading
            heading: Nord Pool comparison
            heading_style: title
            icon: mdi:scale-balance
          - type: statistics-graph
            title: Monthly fixed vs Nord Pool + markup
            entities:
              - entity: alexela:REPLACE_WITH_CRM_ID_electricity_cost
                name: Fixed price
                color: "#e67e22"
              - entity: alexela:REPLACE_WITH_CRM_ID_nord_pool_provider_reference_cost
                name: Nord Pool + markup
                color: "#2980b9"
            days_to_show: 730
            chart_type: bar
            stat_types:
              - change
            period: month
            min_y_axis: 0
            fit_y_data: true
            grid_options:
              columns: full
              rows: 7
          - type: statistics-graph
            title: Daily fixed vs Nord Pool + markup
            entities:
              - entity: alexela:REPLACE_WITH_CRM_ID_electricity_cost
                name: Fixed price
                color: "#e67e22"
              - entity: alexela:REPLACE_WITH_CRM_ID_nord_pool_provider_reference_cost
                name: Nord Pool + markup
                color: "#2980b9"
            days_to_show: 60
            chart_type: bar
            stat_types:
              - change
            period: day
            min_y_axis: 0
            fit_y_data: true
            grid_options:
              columns: full
              rows: 7
          - type: statistics-graph
            title: Daily difference
            entities:
              - entity: alexela:REPLACE_WITH_CRM_ID_electricity_cost_difference_vs_nord_pool_provider
                name: Positive = fixed cost more
                color: "#8e44ad"
            days_to_show: 60
            chart_type: bar
            stat_types:
              - change
            period: day
            fit_y_data: true
            grid_options:
              columns: full
              rows: 6
          - type: statistics-graph
            title: Cumulative cost
            entities:
              - entity: alexela:REPLACE_WITH_CRM_ID_electricity_cost
                name: Fixed price
                color: "#e67e22"
              - entity: alexela:REPLACE_WITH_CRM_ID_nord_pool_provider_reference_cost
                name: Nord Pool + markup
                color: "#2980b9"
            days_to_show: 90
            chart_type: line
            stat_types:
              - sum
            period: day
            min_y_axis: 0
            fit_y_data: true
            grid_options:
              columns: full
              rows: 7
          - type: statistics-graph
            title: Cumulative difference
            entities:
              - entity: alexela:REPLACE_WITH_CRM_ID_electricity_cost_difference_vs_nord_pool_provider
                name: Fixed minus Nord Pool
                color: "#8e44ad"
            days_to_show: 90
            chart_type: line
            stat_types:
              - sum
            period: day
            fit_y_data: true
            grid_options:
              columns: full
              rows: 6

      - type: grid
        cards:
          - type: heading
            heading: Nord Pool prices
            heading_style: title
            icon: mdi:chart-line
          - type: statistics-graph
            title: Matched price range by day
            entities:
              - entity: alexela:REPLACE_WITH_CRM_ID_nord_pool_price
                name: Nord Pool incl. VAT
                color: "#2980b9"
            days_to_show: 60
            chart_type: line
            stat_types:
              - mean
              - min
              - max
            period: day
            fit_y_data: true
            grid_options:
              columns: full
              rows: 7
          - type: statistics-graph
            title: Hourly matched price · 7 days
            entities:
              - entity: alexela:REPLACE_WITH_CRM_ID_nord_pool_price
                name: EUR/kWh
                color: "#2980b9"
            days_to_show: 7
            chart_type: line
            stat_types:
              - mean
            period: hour
            fit_y_data: true
            grid_options:
              columns: full
              rows: 7
